<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CodeHelp - My Profile</title>

    <link
        rel="stylesheet"
        href="/css/style.css">

</head>


<body>

<div class="background-glow glow-1"></div>
<div class="background-glow glow-2"></div>


<!-- NAVBAR -->

<nav class="navbar glass">

    <div class="logo">
        <span>&lt;/&gt;</span>
        CodeHelp
    </div>


    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/problems-page">
            Problems
        </a>

        <a href="/my-problems">
            My Problems
        </a>

        <a href="/messages">
            Messages
        </a>

        <div id="account-area"></div>

    </div>

</nav>


<!-- PROFILE -->

<main class="profile-container">

    <div class="profile-card glass">

        <div class="profile-avatar-large"
             id="profile-avatar">
            P
        </div>


        <p class="eyebrow">
            MY PROFILE
        </p>


        <h1 id="profile-name">
            Loading...
        </h1>


        <p class="profile-email"
           id="profile-email">
            Loading...
        </p>


        <div class="profile-details">

            <div class="profile-detail">

                <span>
                    👤 Name
                </span>

                <strong id="detail-name">
                    -
                </strong>

            </div>


            <div class="profile-detail">

                <span>
                    📧 Email
                </span>

                <strong id="detail-email">
                    -
                </strong>

            </div>

        </div>


        <div class="profile-actions">

            <a
                href="/my-problems"
                class="primary-btn">

                My Problems

            </a>


            <a
                href="/messages"
                class="secondary-btn">

                Messages

            </a>

        </div>

    </div>

</main>


<script src="/js/app.js"></script>

<script src="/js/profile.js"></script>


</body>

</html>
